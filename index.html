<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抽一個，今天去哪！</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans TC", Arial, sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 12px 28px;
      line-height: 1.55;
      color: #222;
      background: #fafafa;
    }

    h1 {
      font-size: 24px;
      line-height: 1.3;
      margin: 0 0 8px;
    }

    p {
      margin: 0 0 10px;
      font-size: 15px;
      color: #444;
    }

    .box {
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 14px;
      margin-top: 14px;
      background: #fff;
    }

    .legend {
      font-size: 14px;
      color: #555;
      background: #fffdf5;
      border: 1px solid #eee3b3;
    }

    .legend-title {
      font-weight: 700;
      margin-bottom: 6px;
      color: #333;
    }

    .legend-item {
      margin: 4px 0;
    }

    input, select, button {
      width: 100%;
      font-size: 16px;
      padding: 14px 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #fff;
    }

    button {
      cursor: pointer;
      background: #f6f6f6;
    }

    button:hover {
      background: #ececec;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .button-row {
      display: block;
    }

    .button-row button {
      width: 100%;
      margin: 8px 0 0;
    }

    .result {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .info-line {
      font-size: 15px;
      color: #333;
      margin: 6px 0;
      word-break: break-word;
    }

    .muted {
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 4px;
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      background: #f2f2f2;
      color: #333;
    }

    #mapFrame {
      width: 100%;
      height: 260px;
      border: 0;
      border-radius: 14px;
      margin-top: 16px;
      background: #f4f4f4;
    }

    .slot-box {
      padding: 14px;
      text-align: center;
      background: linear-gradient(180deg, #fdfdfd 0%, #f7f7f7 100%);
    }

    .slot-title {
      font-size: 15px;
      color: #555;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .slot-shell {
      position: relative;
      padding: 16px 18px 18px;
      border-radius: 24px;
      background: linear-gradient(180deg, #d42828 0%, #9b1212 100%);
      border: 4px solid #7d0d0d;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.18),
        inset 0 -3px 0 rgba(0,0,0,0.18),
        0 12px 24px rgba(0,0,0,0.18);
      overflow: visible;
    }

    .slot-top {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
      gap: 10px;
    }

    .slot-light {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #ffd86b;
      box-shadow: 0 0 8px rgba(255,216,107,0.9);
      animation: blinkLights 1s infinite alternate;
    }

    .slot-light:nth-child(2) { animation-delay: 0.1s; }
    .slot-light:nth-child(3) { animation-delay: 0.2s; }
    .slot-light:nth-child(4) { animation-delay: 0.3s; }
    .slot-light:nth-child(5) { animation-delay: 0.4s; }

    @keyframes blinkLights {
      from { opacity: 0.55; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1.08); }
    }

    .slot-machine-wrap {
      position: relative;
      padding-right: 34px;
    }

    .slot-machine {
      position: relative;
      height: 96px;
      border: 3px solid #ddd;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, #141414 0%, #090909 100%);
      box-shadow: inset 0 0 22px rgba(255,255,255,0.08);
    }

    .slot-window {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
    }

    .slot-item {
      width: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      word-break: break-word;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .slot-glow-top,
    .slot-glow-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      height: 22px;
      z-index: 2;
      pointer-events: none;
    }

    .slot-glow-top {
      top: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.44) 0%, rgba(0,0,0,0) 100%);
    }

    .slot-glow-bottom {
      bottom: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.44) 0%, rgba(0,0,0,0) 100%);
    }

    .slot-highlight {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 50%;
      height: 54px;
      transform: translateY(-50%);
      border: 1px solid rgba(255,255,255,0.32);
      border-radius: 12px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset;
      z-index: 1;
      pointer-events: none;
    }

    .slot-handle-wrap {
      position: absolute;
      right: -6px;
      top: 10px;
      width: 42px;
      height: 130px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .slot-handle-arm {
      position: absolute;
      top: 0;
      width: 8px;
      height: 84px;
      border-radius: 999px;
      background: linear-gradient(180deg, #d7d7d7 0%, #8f8f8f 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
      transform-origin: top center;
      transition: transform 0.2s ease;
    }

    .slot-handle-knob {
      position: absolute;
      bottom: 28px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: radial-gradient(circle at 35% 35%, #fff0a3 0%, #ffcd39 45%, #d88b00 100%);
      border: 2px solid #9f5c00;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
      transition: transform 0.2s ease;
    }

    .pulling .slot-handle-arm {
      transform: translateY(22px);
    }

    .pulling .slot-handle-knob {
      transform: translateY(22px);
    }

    .slot-status {
      margin-top: 12px;
      font-size: 14px;
      color: #fdf0f0;
      min-height: 22px;
    }

    .winner-burst {
      animation: winnerPop 0.7s ease;
    }

    .shake-win {
      animation: shakeWin 0.45s ease;
    }

    @keyframes winnerPop {
      0% { transform: scale(0.92); }
      40% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes shakeWin {
      0% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }

    @media (min-width: 769px) {
      body {
        padding: 32px 16px 40px;
      }

      h1 {
        font-size: 30px;
      }

      #mapFrame {
        height: 320px;
      }

      .slot-item {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <h1>吃飯囉，晚餐隨機選擇器</h1>
  <p>先匯入你的 CSV 清單，手機會記住資料。下次打開可直接使用。</p>

  <div class="box legend">
    <div class="legend-title">價格說明</div>
    <div class="legend-item">$：平價（例如：小吃店）</div>
    <div class="legend-item">$$：一般餐廳（例如：簡餐、咖啡廳）</div>
    <div class="legend-item">$$$：高級餐廳（例如：飯店餐廳、高檔燒肉）</div>
    <div class="legend-item">$$$$：極昂貴</div>
  </div>

  <div class="box">
    <input type="file" id="fileInput" accept=".csv" />
    <select id="citySelect">
      <option value="">全部城市</option>
    </select>
    <select id="priceSelect">
      <option value="">全部價格</option>
    </select>
    <select id="typeSelect">
      <option value="">全部類型</option>
    </select>
    <input type="text" id="keywordInput" placeholder="可輸入關鍵字，例如 火鍋、燒肉、咖啡廳" />

    <div class="button-row">
      <button id="pickBtn">開始抽選</button>
      <button id="clearBtn">清空篩選</button>
      <button id="resetDataBtn">清除已儲存清單</button>
    </div>

    <div class="muted" id="countText">尚未載入資料</div>
  </div>

  <div class="box slot-box hidden" id="slotBox">
    <div class="slot-title">今晚吃什麼</div>

    <div class="slot-shell" id="slotShell">
      <div class="slot-top">
        <span class="slot-light"></span>
        <span class="slot-light"></span>
        <span class="slot-light"></span>
        <span class="slot-light"></span>
        <span class="slot-light"></span>
      </div>

      <div class="slot-machine-wrap">
        <div class="slot-machine" id="slotMachine">
          <div class="slot-glow-top"></div>
          <div class="slot-window">
            <div class="slot-item" id="slotItem">準備抽選中</div>
          </div>
          <div class="slot-highlight"></div>
          <div class="slot-glow-bottom"></div>
        </div>

        <div class="slot-handle-wrap">
          <div class="slot-handle-arm" id="slotHandleArm"></div>
          <div class="slot-handle-knob" id="slotHandleKnob"></div>
        </div>
      </div>

      <div class="slot-status" id="slotStatus">按下開始抽選</div>
    </div>
  </div>

  <div class="box hidden" id="resultBox">
    <div class="result" id="nameText"></div>
    <div class="tag-row">
      <span class="tag" id="ratingTag"></span>
      <span class="tag" id="countTag"></span>
      <span class="tag" id="priceTag"></span>
      <span class="tag" id="typeTag"></span>
      <span class="tag" id="cityTag"></span>
    </div>
    <div class="info-line" id="addressText"></div>
    <div class="info-line" id="noteText"></div>

    <iframe
      id="mapFrame"
      loading="lazy"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <div class="button-row">
      <button id="openMapBtn">打開 Google Maps</button>
      <button id="repickBtn">再抽一次</button>
    </div>
  </div>

  <script>
    const GOOGLE_MAPS_EMBED_API_KEY = "AIzaSyA5w05iPO1LEB-Wm62pYRKApkfLd9-ilzs";

    let places = [];
    let lastPicked = null;
    let isAnimating = false;

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            value += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(value);
          value = "";
        } else if ((char === "\n" || char === "\r") && !inQuotes) {
          if (char === "\r" && next === "\n") i++;
          row.push(value);
          if (row.some(cell => cell.trim() !== "")) rows.push(row);
          row = [];
          value = "";
        } else {
          value += char;
        }
      }

      if (value.length > 0 || row.length > 0) {
        row.push(value);
        if (row.some(cell => cell.trim() !== "")) rows.push(row);
      }

      return rows;
    }

    function normalizeHeader(text) {
      return text.trim().toLowerCase();
    }

    function getCell(obj, keys) {
      for (const key of keys) {
        if (obj[key] !== undefined) return String(obj[key]).trim();
      }
      return "";
    }

    function cleanValue(value) {
      if (value === null || value === undefined) return "";
      const text = String(value).trim();
      if (!text || text.toLowerCase() === "nan") return "";
      return text;
    }

    function saveCSVToLocal(text) {
      localStorage.setItem("dinner_csv_text", text);
    }

    function loadCSVFromLocal() {
      const saved = localStorage.getItem("dinner_csv_text");
      if (saved) {
        loadCSV(saved);
      }
    }

    function formatType(type) {
      const value = cleanValue(type).toLowerCase();
      const map = {
        restaurant: "餐廳",
        store: "小吃店／商店",
        bar: "酒吧",
        cafe: "咖啡廳",
        bakery: "麵包店",
        meal_takeaway: "外帶餐飲",
        meal_delivery: "外送餐飲",
        food_court: "美食街"
      };
      return map[value] || cleanValue(type) || "未提供";
    }

    function loadCSV(text) {
      const rows = parseCSV(text);
      if (rows.length < 2) {
        alert("CSV 內容不足，至少要有標題列和一筆資料。");
        return;
      }

      const headers = rows[0].map(normalizeHeader);

      places = rows.slice(1).map(cols => {
        const rowObj = {};
        headers.forEach((h, i) => rowObj[h] = cols[i] || "");

        return {
          name: cleanValue(getCell(rowObj, ["name", "title", "店名", "名稱"])),
          address: cleanValue(getCell(rowObj, ["address", "地址"])),
          rating: cleanValue(getCell(rowObj, ["rating", "評分"])),
          count: cleanValue(getCell(rowObj, ["count", "reviews", "評論數", "評價數"])),
          price: cleanValue(getCell(rowObj, ["price", "價格"])),
          type: cleanValue(getCell(rowObj, ["type", "類型", "分類"])),
          city: cleanValue(getCell(rowObj, ["city", "城市"])),
          note: cleanValue(getCell(rowObj, ["note", "備註", "tag"])),
          url: cleanValue(getCell(rowObj, ["url", "link", "maps", "googlemaps"]))
        };
      }).filter(p => p.name || p.address);

      updateCityOptions();
      updatePriceOptions();
      updateTypeOptions();
      document.getElementById("countText").textContent = `已載入 ${places.length} 間店`;
    }

    function updateSelectOptions(selectId, values, defaultLabel) {
      const select = document.getElementById(selectId);
      const currentValue = select.value;
      select.innerHTML = `<option value="">${defaultLabel}</option>`;

      values.forEach(item => {
        const option = document.createElement("option");
        option.value = item.value;
        option.textContent = item.label;
        select.appendChild(option);
      });

      if ([...select.options].some(option => option.value === currentValue)) {
        select.value = currentValue;
      }
    }

    function updateCityOptions() {
      const cities = [...new Set(places.map(p => p.city).filter(v => v))]
        .sort((a, b) => a.localeCompare(b, "zh-Hant"))
        .map(v => ({ value: v, label: v }));

      updateSelectOptions("citySelect", cities, "全部城市");
    }

    function updatePriceOptions() {
      const priceOrder = ["$", "$$", "$$$", "$$$$"];
      const prices = [...new Set(places.map(p => p.price).filter(v => v))]
        .sort((a, b) => {
          const ai = priceOrder.indexOf(a);
          const bi = priceOrder.indexOf(b);
          return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
        })
        .map(v => ({ value: v, label: v }));

      updateSelectOptions("priceSelect", prices, "全部價格");
    }

    function updateTypeOptions() {
      const types = [...new Set(places.map(p => p.type).filter(v => v))]
        .sort((a, b) => formatType(a).localeCompare(formatType(b), "zh-Hant"))
        .map(v => ({ value: v, label: formatType(v) }));

      updateSelectOptions("typeSelect", types, "全部類型");
    }

    function filterPlaces() {
      const keyword = document.getElementById("keywordInput").value.trim().toLowerCase();
      const selectedCity = document.getElementById("citySelect").value.trim().toLowerCase();
      const selectedPrice = document.getElementById("priceSelect").value.trim();
      const selectedType = document.getElementById("typeSelect").value.trim().toLowerCase();

      return places.filter(p => {
        const matchCity = !selectedCity || (p.city || "").toLowerCase() === selectedCity;
        const matchPrice = !selectedPrice || (p.price || "") === selectedPrice;
        const matchType = !selectedType || (p.type || "").toLowerCase() === selectedType;
        const text = `${p.name} ${p.address} ${p.city} ${p.note} ${p.type} ${formatType(p.type)} ${p.price}`.toLowerCase();
        const matchKeyword = !keyword || text.includes(keyword);
        return matchCity && matchPrice && matchType && matchKeyword;
      });
    }

    function updateEmbeddedMap(place) {
      const mapFrame = document.getElementById("mapFrame");
      if (!mapFrame) return;

      if (!GOOGLE_MAPS_EMBED_API_KEY) {
        mapFrame.src = "";
        mapFrame.style.display = "none";
        return;
      }

      mapFrame.style.display = "block";
      const query = [place.name, place.address].filter(Boolean).join(" ");
      const embedUrl = `https://www.google.com/maps/embed/v1/search?key=${encodeURIComponent(GOOGLE_MAPS_EMBED_API_KEY)}&q=${encodeURIComponent(query)}`;
      mapFrame.src = embedUrl;
    }

    function setButtonsDisabled(disabled) {
      document.getElementById("pickBtn").disabled = disabled;
      document.getElementById("repickBtn").disabled = disabled;
      document.getElementById("clearBtn").disabled = disabled;
      document.getElementById("resetDataBtn").disabled = disabled;
      document.getElementById("fileInput").disabled = disabled;
      document.getElementById("citySelect").disabled = disabled;
      document.getElementById("priceSelect").disabled = disabled;
      document.getElementById("typeSelect").disabled = disabled;
      document.getElementById("keywordInput").disabled = disabled;
    }

    function setSlotText(text) {
      const slotItem = document.getElementById("slotItem");
      slotItem.classList.remove("winner-burst");
      slotItem.style.opacity = "0.18";
      slotItem.style.transform = "translateY(26px)";

      requestAnimationFrame(() => {
        slotItem.textContent = text;
        slotItem.style.opacity = "1";
        slotItem.style.transform = "translateY(0)";
      });
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function animateHandlePull() {
      const shell = document.getElementById("slotShell");
      shell.classList.add("pulling");
      await sleep(220);
      shell.classList.remove("pulling");
      await sleep(110);
    }

    async function runSlotAnimation(filtered, winner) {
      const slotBox = document.getElementById("slotBox");
      const slotStatus = document.getElementById("slotStatus");
      const slotItem = document.getElementById("slotItem");
      const slotShell = document.getElementById("slotShell");

      slotBox.classList.remove("hidden");
      slotStatus.textContent = "準備啟動老虎機";
      document.getElementById("resultBox").classList.add("hidden");

      await animateHandlePull();

      const pool = filtered.length >= 8 ? filtered : [...filtered, ...filtered, ...filtered, ...filtered];
      const totalRounds = 34;

      slotStatus.textContent = "老虎機高速抽選中";

      for (let i = 0; i < totalRounds; i++) {
        const current = pool[i % pool.length];
        setSlotText(current.name || "未命名地點");

        if (i < 16) {
          await sleep(55);
        } else if (i < 25) {
          await sleep(95 + (i - 16) * 16);
        } else {
          await sleep(185 + (i - 25) * 45);
        }
      }

      slotStatus.textContent = "最後結果揭曉";
      setSlotText(winner.name || "未命名地點");
      slotItem.classList.add("winner-burst");
      slotShell.classList.remove("shake-win");
      void slotShell.offsetWidth;
      slotShell.classList.add("shake-win");
      await sleep(550);
      slotShell.classList.remove("shake-win");
      slotStatus.textContent = "今晚就吃這家";
    }

    async function pickRandomWithAnimation() {
      if (isAnimating) return;

      if (places.length === 0) {
        alert("請先載入 CSV。");
        return;
      }

      const filtered = filterPlaces();

      if (filtered.length === 0) {
        alert("找不到符合條件的店家。");
        return;
      }

      isAnimating = true;
      setButtonsDisabled(true);

      const index = Math.floor(Math.random() * filtered.length);
      lastPicked = filtered[index];

      await runSlotAnimation(filtered, lastPicked);
      renderResult(lastPicked, filtered.length);

      isAnimating = false;
      setButtonsDisabled(false);
    }

    function setTag(id, text, fallback) {
      const el = document.getElementById(id);
      el.textContent = text || fallback;
    }

    function renderResult(place, count) {
      document.getElementById("resultBox").classList.remove("hidden");
      document.getElementById("nameText").textContent = place.name || "未命名地點";

      setTag("ratingTag", place.rating ? `★ ${place.rating}` : "★ 未提供", "★ 未提供");
      setTag("countTag", place.count ? `${place.count} 則評價` : "評價數未提供", "評價數未提供");
      setTag("priceTag", place.price ? `價格：${place.price}` : "價格未提供", "價格未提供");
      setTag("typeTag", place.type ? `類型：${formatType(place.type)}` : "類型未提供", "類型未提供");
      setTag("cityTag", place.city ? `城市：${place.city}` : "城市未提供", "城市未提供");

      document.getElementById("addressText").textContent = place.address ? `地址：${place.address}` : "地址：未提供";
      document.getElementById("noteText").textContent = place.note ? `備註：${place.note}` : "備註：無";
      document.getElementById("countText").textContent = `本次候選共 ${count} 間`;

      updateEmbeddedMap(place);
    }

    function openInGoogleMaps() {
      if (!lastPicked) return;

      if (lastPicked.url) {
        window.open(lastPicked.url, "_blank");
        return;
      }

      const query = [lastPicked.name, lastPicked.address].filter(Boolean).join(" ");
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      window.open(mapsUrl, "_blank");
    }

    document.getElementById("fileInput").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        loadCSV(text);
        saveCSVToLocal(text);
      };
      reader.readAsText(file, "utf-8");
    });

    document.getElementById("pickBtn").addEventListener("click", pickRandomWithAnimation);
    document.getElementById("repickBtn").addEventListener("click", pickRandomWithAnimation);
    document.getElementById("openMapBtn").addEventListener("click", openInGoogleMaps);

    document.getElementById("clearBtn").addEventListener("click", function() {
      if (isAnimating) return;
      document.getElementById("keywordInput").value = "";
      document.getElementById("citySelect").value = "";
      document.getElementById("priceSelect").value = "";
      document.getElementById("typeSelect").value = "";
      document.getElementById("countText").textContent = places.length ? `已載入 ${places.length} 間店` : "尚未載入資料";
    });

    document.getElementById("resetDataBtn").addEventListener("click", function() {
      if (isAnimating) return;
      localStorage.removeItem("dinner_csv_text");
      places = [];
      lastPicked = null;
      document.getElementById("citySelect").innerHTML = '<option value="">全部城市</option>';
      document.getElementById("priceSelect").innerHTML = '<option value="">全部價格</option>';
      document.getElementById("typeSelect").innerHTML = '<option value="">全部類型</option>';
      document.getElementById("countText").textContent = "尚未載入資料";
      document.getElementById("resultBox").classList.add("hidden");
      document.getElementById("slotBox").classList.add("hidden");
      alert("已清除手機中儲存的清單。");
    });

    loadCSVFromLocal();
  </script>
</body>
</html>
